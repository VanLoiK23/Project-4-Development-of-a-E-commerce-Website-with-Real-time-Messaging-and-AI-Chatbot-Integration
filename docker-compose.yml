name: phone-ecommerce

services:
  db:
    image: postgres:17-alpine
    container_name: phone-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quanlibanhang}
      POSTGRES_USER: ${POSTGRES_USER:-phoneshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - phone-network
      
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
      args:
        JAVA_VERSION: ${JAVA_VERSION:-21}
    container_name: phone-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-quanlibanhang}
      DB_USERNAME: ${POSTGRES_USER:-phoneshop}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      REDIS_HOST: redis_cache
      REDIS_PORT: 6379
      URL_FE: http://localhost:80/
      # JWT_SECRET: ${JWT_SECRET}
      # MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE}
      # MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY}
      # MOMO_SECRET_KEY: ${MOMO_SECRET_KEY}
      TZ: Asia/Ho_Chi_Minh
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Ho_Chi_Minh -XX:MaxRAMPercentage=75"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    networks:
      - phone-network

  web:
    build:
      context: ./Web
      dockerfile: Dockerfile
      args:
        BACKEND_INTERNAL_URL: http://backend:8080
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:80}
    container_name: phone-web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: "80"
      HOSTNAME: 0.0.0.0
      BACKEND_INTERNAL_URL: http://backend:8080
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - phone-network

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - phone-network

  adminer:
    image: adminer:latest
    container_name: phone-adminer
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:8081:8080"

volumes:
  pgdata:
  redis_data:


networks:
  phone-network:
    driver: bridge
